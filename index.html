    <script>
        (function () {
            var manifestLink = document.getElementById('site-manifest');
            var faviconLink = document.getElementById('site-favicon');
            var appleTouchIconLink = document.getElementById('site-apple-touch-icon');
            if (!manifestLink || !faviconLink || !appleTouchIconLink || !window.matchMedia) return;

            var mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
            var updateBrandAssets = function (isDark) {
                manifestLink.setAttribute('href', isDark ? '/manifest-dark.webmanifest' : '/manifest-light.webmanifest');
                faviconLink.setAttribute('href', isDark ? '/DALLA_Favicon_dark.svg' : '/DALLA_Favicon_light.svg');
                appleTouchIconLink.setAttribute('href', isDark ? '/DALLA_Favicon_dark_appletouch.png' : '/DALLA_Favicon_light_appletouch.png');
            };

            updateBrandAssets(mediaQuery.matches);

            if (typeof mediaQuery.addEventListener === 'function') {
                mediaQuery.addEventListener('change', function (event) {
                    updateBrandAssets(event.matches);
                });
            } else if (typeof mediaQuery.addListener === 'function') {
                mediaQuery.addListener(function (event) {
                    updateBrandAssets(event.matches);
                });
            }
        })();
    </script>
